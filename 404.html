<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Disappeared (Like Your Motivation)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Floating background elements for a subtle gamified vibe */
        .floating-shape {
            position: absolute;
            background: linear-gradient(45deg, #1f2833, #333);
            border-radius: 50%;
            opacity: 0.2;
            z-index: 1;
            animation: float 8s infinite ease-in-out;
        }

        .shape1 { width: 80px; height: 80px; top: 15%; left: 10%; animation-delay: 0s; }
        .shape2 { width: 120px; height: 120px; bottom: 15%; right: 10%; animation-delay: 2s; }
        .shape3 { width: 50px; height: 50px; top: 70%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .container {
            max-width: 600px;
            background: rgba(31, 40, 51, 0.4);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #45a29e;
            box-shadow: 0 10px 30px rgba(102, 252, 241, 0.1);
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            color: #66fcf1;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }

        h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #c5c6c7;
        }

        .accent {
            color: #66fcf1;
            font-weight: bold;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 35px;
        }

        .card {
            background: rgba(11, 12, 16, 0.6);
            border: 1px solid #1f2833;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            border-color: #66fcf1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 252, 241, 0.1);
        }

        .card-title {
            color: #fff;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .btn {
            display: inline-block;
            background-color: #66fcf1;
            color: #0b0c10;
            text-decoration: none;
            padding: 15px 35px;
            font-weight: 700;
            border-radius: 50px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Decorative background elements -->
    <div class="floating-shape shape1"></div>
    <div class="floating-shape shape2"></div>
    <div class="floating-shape shape3"></div>

    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Much like your <span class="accent">motivation to study chemistry</span> at 11 PM, this page is completely missing.</p>

        <div class="card-grid">
            <div class="card" onclick="alert('heoieq3hfderoifhufuofhrfu4uifhuofhr49hehfoihfr4hioceriferhiofcehiochr')">
                <div class="card-title">Become Confused</div>
                <div>ok</div>
            </div>
            <div class="card" onclick="alert('Really bro')">
                <div class="card-title">be bored</div>
                <div>ok</div>
            </div>
            <div class="card" onclick="alert('bruh what u doing')">
                <div class="card-title">Procrastinate</div>
                <div>Admit it, you intentionally tried to break the app to avoid studying.</div>
            </div>
        </div>

        <button class="btn" onclick="window.location.href='https://study.mplace.cc'">Take Me Back to Safety</button>
    </div>

</body>
</html>
